# Builds the hello-box example for real, on each supported operating system.
#
# The unit suite stubs the environment solve, so it proves everything after the solve and nothing
# about the solve itself: whether pixi and conda-pack are usable on this OS, whether the packed tree
# relocates, whether the interpreter inside the box runs at all. That gap is where the "paths that
# break silently" in AGENTS.md live, and this is the only job that closes it.
#
# Deliberately a separate workflow rather than a job in ci.yml: GitHub applies `paths` filters per
# workflow, not per job, and ci.yml holds the docs job that must keep running on docs-only changes.
# Splitting the file is what keeps this expensive job out of documentation and Python pushes.
name: example build

permissions:
  contents: read

# Only what can change what a box contains triggers a rebuild. Documentation, the Python consumer
# and the unit tests cannot, and together they are roughly a third of this repository's commits.
#
# There is no `pull_request` trigger: this project pushes straight to main, so it would never fire.
# Add one, with this same paths list, if that ever changes.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/**'
      # Later patterns win, so prose under examples/ does not pay for a build it cannot change.
      - '!examples/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/example-build.yml'
  # The failures here rarely come from a commit. They come from conda-forge and pixi moving
  # underneath a committed lock, which no push would ever catch.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Three pushes in a row should cost one build, not three.
concurrency:
  group: example-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must equal `pixiVersion` in the example scrolls, or `doctor` refuses the mismatch before the
  # build starts — which is the check working, not a nuisance. Pinning also keeps `init` away from
  # the GitHub releases API, whose unauthenticated rate limit answers 403 on a runner.
  PIXI_VERSION: '0.73.0'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # No `continue-on-error`: it was here while the job was unproven, and it made the first run
    # report success while all three targets failed. A monitor that cannot go red monitors nothing.
    #
    # Should this ever become a required check, note that the `paths` filter above would leave a
    # pull request touching none of those paths waiting forever for a job that never starts — a
    # required check and a path filter do not combine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-cpu
          - os: macos-latest
            target: macos-aarch64-metal
          - os: windows-latest
            target: windows-x86_64-cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Uses Scrollcase's own checksum-verifying installer instead of a third-party action, which
      # also exercises the project-toolchain half of discovery. `init` scaffolds a workspace as a
      # side effect; those files are untracked, so `git clean -fd` removes them while leaving the
      # ignored `.scrollcase/` toolchain in place. The tree must be clean again before `build`,
      # because refusing a dirty tree is one of the guarantees under test here.
      - name: Install the pinned toolchain
        run: node src/cli.mjs init --install-toolchain --no-example --pixi-version ${{ env.PIXI_VERSION }}

      - name: Restore a clean tree
        shell: bash
        run: |
          git clean -fd
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tree is still dirty after cleaning up init's scaffolding:" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Report what this machine can do
        run: node src/cli.mjs doctor --scroll hello-box --target ${{ matrix.target }} --scrolls-dir examples

      # Ephemeral: generated in the runner, used for this run only, never exported. The example is
      # signed to prove the signing path works, not to produce anything anyone should trust.
      - name: Create an ephemeral signing key
        run: node src/cli.mjs keygen

      # The Action needs an ordinary consumer workspace. Keep that workspace in a nested, clean
      # checkout so provenance remains honest without adding example-only configuration at the
      # repository root. Its generated state is ignored by both repositories and disappears with
      # the runner.
      - name: Stage the Action validation workspace
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '.action-validation/' >> .git/info/exclude
          mkdir .action-validation
          cp -R examples .action-validation/examples
          printf '%s\n' '{"version":1,"paths":{"scrolls":"examples","build":".scrollcase/build","dist":".scrollcase/dist","keys":"../.scrollcase/keys","toolchain":"../.scrollcase/toolchain"}}' > .action-validation/scrollcase.config.json
          printf '%s\n' '.scrollcase/' > .action-validation/.gitignore
          git -C .action-validation init
          git -C .action-validation config user.name scrollcase-ci
          git -C .action-validation config user.email scrollcase-ci@users.noreply.github.com
          git -C .action-validation add .
          git -C .action-validation commit -m 'Stage Action validation fixtures'

      # This is the Marketplace path under test: the checked-out Action builds, signs, verifies,
      # extracts and runs the declared self-test rather than invoking an installed CLI wrapper.
      - name: Build and verify the Python demo with the Action
        id: action-hello
        uses: ./
        with:
          working-directory: .action-validation
          scroll: hello-box
          target: ${{ matrix.target }}
          install-toolchain: 'false'

      - name: Run the box entry point
        shell: bash
        run: node src/cli.mjs run "${{ steps.action-hello.outputs.release }}"

      # What a box costs its user is worth seeing on every run, not reconstructed from a download
      # when someone happens to wonder. The two numbers differ per platform for real reasons.
      - name: Report the box size
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const signed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const payload = JSON.parse(Buffer.from(signed.payloadBase64, "base64").toString("utf8"));
            const mb = (bytes) => (bytes / 1024 / 1024).toFixed(1) + " MB";
            console.log(`archive   ${mb(payload.archive.sizeBytes)}`);
            console.log(`extracted ${mb(payload.installedSizeBytes)}`);
          ' "${{ steps.action-hello.outputs.release }}"

      # The two smoke tests for the other runtimes, on the one target their scrolls declare. They
      # are the only thing in CI that builds a box with no interpreter, and a box whose interpreter
      # is not Python — the paths where a Python assumption would hide, and where the unit suite's
      # fake toolchain cannot follow. Each is built, verified with its own self-test, and run.
      - name: Build, verify and run the node and native smoke tests
        if: matrix.target == 'macos-aarch64-metal'
        shell: bash
        run: |
          set -euo pipefail
          release_for() {
            ls .scrollcase/dist/boxes/"$1"/1.0.0/${{ matrix.target }}/*.release.json
          }

          node src/cli.mjs build hello-box-node/${{ matrix.target }} --scrolls-dir examples
          node src/cli.mjs verify "$(release_for hello-box-node)" --self-test
          node src/cli.mjs run "$(release_for hello-box-node)"

          node src/cli.mjs build hello-box-native/${{ matrix.target }} --scrolls-dir examples
          node src/cli.mjs verify "$(release_for hello-box-native)" --self-test
          node src/cli.mjs run "$(release_for hello-box-native)" -- --version

      # Exercise the other two runtimes through the Action on every compatible host. These builds
      # are runner-local validation only: no tag, release or publishing workflow is involved.
      - name: Build and verify the Node demo with the Action
        id: action-codon
        uses: ./
        with:
          working-directory: .action-validation
          scroll: codon-demo
          target: ${{ matrix.target }}
          install-toolchain: 'false'

      - name: Run the Node demo
        shell: bash
        run: node src/cli.mjs run "${{ steps.action-codon.outputs.release }}" -- Leucine

      - name: Build and verify the native demo with the Action
        id: action-dataset
        uses: ./
        with:
          working-directory: .action-validation
          scroll: dataset-demo
          target: ${{ matrix.target }}
          install-toolchain: 'false'

      - name: Run the native demo
        shell: bash
        run: node src/cli.mjs run "${{ steps.action-dataset.outputs.release }}" -- -H readings.h5

      # Keep the larger native transcode demo as direct end-to-end CLI coverage; the smaller
      # dataset demo above already exercises the same runtime through the Action.
      - name: Build, verify and run the transcode demo
        shell: bash
        run: |
          set -euo pipefail
          release_for() {
            ls .scrollcase/dist/boxes/"$1"/1.0.0/${{ matrix.target }}/*.release.json
          }

          # The native counterpart: a large compiled program with a long tail of codec libraries,
          # whose self-test runs a real encode rather than a version check. Slower than the rest of
          # this job put together, and the only thing here that would catch a break in the one case
          # `native` exists for.
          node src/cli.mjs build transcode-demo/${{ matrix.target }} --scrolls-dir examples
          node src/cli.mjs verify "$(release_for transcode-demo)" --self-test
          node src/cli.mjs run "$(release_for transcode-demo)" -- -version

      # Determinism is a promise the repository makes that nothing else verifies end to end.
      #
      # The assertion is the archive's *name*, not the file count. The archive is named by its own
      # SHA-256, but a build clears its own object directory before writing into it, so a rebuild
      # replaces the first archive rather than landing beside it — counting the files afterwards
      # always yields one and could never fail. Measured: changing the scroll's sourceRevision
      # produced a completely different archive and left the count at one.
      - name: Rebuild the Python demo with the Action
        id: action-hello-rebuild
        uses: ./
        with:
          working-directory: .action-validation
          scroll: hello-box
          target: ${{ matrix.target }}
          install-toolchain: 'false'

      - name: Compare rebuild
        shell: bash
        run: |
          if [ "${{ steps.action-hello.outputs.archive-sha256 }}" != "${{ steps.action-hello-rebuild.outputs.archive-sha256 }}" ]; then
            echo "Rebuild was not byte-identical" >&2
            exit 1
          fi
          echo "Rebuild produced a byte-identical archive: ${{ steps.action-hello-rebuild.outputs.archive-sha256 }}"
